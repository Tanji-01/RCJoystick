name: Build RC Car APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install SDK
        run: sdkmanager "platforms;android-30" "build-tools;30.0.3"

      - name: Extract project
        run: unzip -q RCJoystick_GitHub_Build.zip

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle -p RCJoystick_AIDE assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RC-Car-APK
          path: RCJoystick_AIDE/app/build/outputs/apk/debug/*.apk
