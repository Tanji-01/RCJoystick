name: Build RC Car APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # Java 17 for Android SDK
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # Install required SDK packages
      - name: Install SDK
        run: |
          sdkmanager --install \
            "platforms;android-30" \
            "build-tools;30.0.3"

      # Switch to Java 11 for legacy project compatibility
      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # Extract project
      - name: Extract project
        run: unzip -q RCJoystick_GitHub_Build.zip

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.1'

      # Build APK
      - name: Build APK
        run: gradle --gradle --no-daemon assembleDebug
      # Verify APK
      - name: Verify APK
        run: |
          APK="RCJoystick_AIDE/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RCJoystick-APK
          path: RCJoystick_AIDE/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
