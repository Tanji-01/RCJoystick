name: Build RC Joystick APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Java 17 for Android SDK
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 4. Install required SDK packages
      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platforms;android-30" \
            "build-tools;30.0.3"

      # 5. Switch to Java 11 for legacy project
      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # 6. Extract Android project
      - name: Extract project
        run: |
          test -f APEX_RC_Controller_v2_Source.zip
          unzip -o -q APEX_RC_Controller_v2_Source.zip -x '.github/*'

      # Fix missing Android drawable import in the archived Java source
      - name: Fix missing GradientDrawable import
        run: |
          JAVA_FILE="app/src/main/java/com/shoaib/rccontroller/MainActivity.java"
          test -f "$JAVA_FILE"
          if ! grep -q '^import android.graphics.drawable.GradientDrawable;' "$JAVA_FILE"; then
            sed -i '/^package /a import android.graphics.drawable.GradientDrawable;' "$JAVA_FILE"
          fi

      # Fix blank launch screen: attach the constructed root layout to the Activity
      - name: Attach APEX UI to Activity
        run: |
          JAVA_FILE="app/src/main/java/com/shoaib/rccontroller/MainActivity.java"
          grep -q 'content.addView(right,new LinearLayout.LayoutParams(0,-1,1.02f));' "$JAVA_FILE"
          if ! grep -q 'setContentView(root);' "$JAVA_FILE"; then
            sed -i '/content.addView(right,new LinearLayout.LayoutParams(0,-1,1.02f));/a\        setContentView(root);' "$JAVA_FILE"
          fi
          grep -q 'setContentView(root);' "$JAVA_FILE"

      # 7. Verify project structure
      - name: Check project files
        run: |
          echo "Checking Android project..."
          ls -la
          test -f settings.gradle
          test -f app/build.gradle
          echo "Project structure verified!"

      # 8. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.1'

      # 9. Build APK
      - name: Build APK
        run: |
          gradle --no-daemon assembleDebug

      # 10. Verify APK
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          echo "Checking APK..."
          test -s "$APK"
          ls -lh "$APK"
          echo "APK generated successfully!"

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RCJoystick-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
