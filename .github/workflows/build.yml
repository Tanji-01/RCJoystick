name: Build RC Car APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 4. Install Android SDK packages
      - name: Install SDK
        run: |
          sdkmanager --install \
            "platforms;android-30" \
            "build-tools;30.0.3"

      # 5. Extract project
      - name: Extract project
        run: unzip -q RCJoystick_GitHub_Build.zip

      # 6. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.1'

      # 7. Build APK
      - name: Build APK
        run: gradle --no-daemon -p RCJoystick_AIDE assembleDebug

      # 8. Verify APK
      - name: Verify APK
        run: |
          APK="RCJoystick_AIDE/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RCJoystick-APK
          path: RCJoystick_AIDE/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
